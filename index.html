<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>cardpack (목업 v0.3)</title>
<link rel="stylesheet" href="css/unpack.css">
<style>
:root{--bg:#14161c;--panel:#1d2029;--panel2:#242835;--line:#2c303c;--text:#e8e9ee;--muted:#9097a8;--accent:#5b8cff;--good:#2bb673;--bad:#ff6b6b;--warn:#ffd76a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}
select,button{font:inherit;background:#262a35;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.big{padding:9px 16px;font-weight:700}
button:disabled{opacity:.4;cursor:default}
a{color:#8fb0ff}

/* ---------- 메인 화면 ---------- */
#app{max-width:1560px;margin:0 auto;padding:0 16px 110px}
.narrow{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:18px 0 10px}
h2{font-size:15px;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small,.muted{color:var(--muted);font-weight:400;font-size:12px}
.topbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 14px;margin:0 -16px;background:var(--panel);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar b{font-size:16px}
.topbar .sp{margin-left:auto}
.msg{margin:10px auto;max-width:1000px;padding:8px 12px;background:#2a2617;border:1px solid #5a4f22;border-radius:6px;white-space:pre-line;min-height:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.corner{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel2);margin-top:8px}
.corner h3{margin:0 0 8px;font-size:14px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
.pill.on{color:#fff;background:var(--good);border-color:var(--good)}
.big-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 3단 레이아웃: 왼쪽 배너(아이템 상점) / 가운데 / 오른쪽 배너(업그레이드 상점) */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:16px;align-items:start;margin-top:4px}
.layout main{min-width:0}
.banner{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow-y:auto;margin-top:14px;padding:0 10px 12px;border-radius:12px;
  background:linear-gradient(180deg,#232838,#1b1f2a);border:1px solid #343a4c;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.banner.left{border-top:4px solid #3fb8a9;max-height:calc(100vh - 160px)}.banner.right{border-top:4px solid #c792ff}
.ribbon{margin:0 -10px 8px;padding:9px 12px;font-weight:800;letter-spacing:.02em;background:rgba(255,255,255,.04);border-bottom:1px solid #343a4c}
.ribbon.sub{margin-top:12px;font-size:13px;font-weight:700}
.banner p{margin:4px 0 8px}
.sitem{display:flex;flex-direction:column;gap:3px;padding:8px;margin-bottom:6px;border-radius:8px;background:rgba(0,0,0,.22);border:1px solid #2f3445}
.sitem small{color:var(--muted);font-size:11px;line-height:1.35}
.sitem button{align-self:flex-start;margin-top:2px}
.locked{padding:12px;border-radius:8px;border:1px dashed #4a4f62;text-align:center;line-height:1.6}
.effs{margin:4px 0 0;padding-left:18px;font-size:12px}
@media (max-width:1100px){
  .layout{grid-template-columns:1fr 1fr}
  .layout main{grid-column:1 / -1;order:-1}
  .banner,.banner.left{position:static;max-height:none}
}
@media (max-width:640px){ .layout{grid-template-columns:1fr} }

/* 특수 팩 */
.tpacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tpack{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:10px;background:linear-gradient(160deg,#2b2350,#3d1f45);border:1px solid #5b4a8a}
.tpack .tp-name{font-weight:800}
.tpack small{color:#c9c2e6;font-size:11px}
.tpack button{align-self:flex-start}

/* 대회 */
.contest{border:2px solid #d4a72c;background:linear-gradient(160deg,#2b2412,#1d2029);border-radius:12px;padding:4px 14px 12px;margin-top:12px}
.meter{position:relative;height:26px;border-radius:13px;background:#14161c;border:1px solid #4a4022;overflow:hidden}
.meter div{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b8860b,#ffd76a)}
.meter span{position:relative;display:block;text-align:center;line-height:26px;font-weight:700;font-size:13px;text-shadow:0 1px 2px #000}

/* 미니 카드 (상점 진열용) */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mini{border-radius:7px;padding:3px;background:var(--g,#a9a49a)}
.mini .in{background:#f6f1e6;color:#22232a;border-radius:5px;padding:4px 6px;font-size:12px;line-height:1.35}
.mini .in b{font-size:13px}
.mini .p{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:3px}
.mini button{padding:2px 6px;font-size:11px}
.g-common{--g:#a9a49a}.g-bronze{--g:linear-gradient(135deg,#7a4a20,#d39558,#6e421c)}.g-silver{--g:linear-gradient(135deg,#8d939b,#fff,#7d838c)}
.g-gold{--g:linear-gradient(135deg,#9c6d08,#fff0a8,#b8860b)}.g-plat{--g:linear-gradient(135deg,#4aa8d8,#f2fdff,#56b6e6)}
.g-diamond{--g:linear-gradient(135deg,#b9d7ee,#fff,#9ec4e4)}.g-rare{--g:linear-gradient(135deg,#ff7773,#ffed5f,#83fff7,#7894ff,#d875ff)}
.g-epic{--g:linear-gradient(115deg,#4c1d95,#c77dff,#7b2ff7)}.g-legend{--g:linear-gradient(115deg,#7f1d1d,#ff4d4d,#dc2626)}
.g-event{--g:linear-gradient(115deg,#ffd76a,#ff7773,#d875ff,#83fff7)}
.mini.f-black .in{background:#0c0c0e;color:#f2f2f2}



/* ---------- 첫 화면: 세로 메뉴 ---------- */
.title{max-width:420px;margin:0 auto;padding-top:min(10vh,80px);display:flex;flex-direction:column;align-items:stretch}
.logo{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.logo .pk{flex:none;width:64px;height:90px;transform:rotate(-8deg)}
.logo .pk-logo{font-size:7px}
.logo h1{font-size:34px;letter-spacing:.08em;margin:0}
.logo p{margin:4px 0 0}
.menu{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px 18px;font-size:17px;font-weight:700;text-align:left;
  border-radius:12px;background:linear-gradient(180deg,#252a38,#1f2330);border:1px solid #343a4c;transition:transform .12s,border-color .12s}
.mitem small{font-weight:500;font-size:12px;color:var(--muted)}
.mitem:hover:not(:disabled){transform:translateX(4px)}
.mitem.primary{background:linear-gradient(160deg,#3a4cff,#9b3dff 60%,#c93fa3);border-color:transparent;color:#fff}
.mitem.primary small{color:#e6dcff}
.title .foot{text-align:center;margin-top:18px}
.title .msg{margin:0 0 12px}
.credits{margin-top:12px;padding:18px 20px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.credits dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;margin:0 0 12px}
.credits dt{color:var(--muted);font-size:13px}
.credits dd{margin:0}

/* ---------- 카드팩 이미지 ---------- */
.shelf{display:flex;flex-wrap:wrap;gap:14px 12px;padding:14px 12px 10px;border-radius:12px;
  background:linear-gradient(180deg,#1f2330,#191c26);border:1px solid var(--line);box-shadow:inset 0 -10px 0 #262b38,inset 0 -12px 0 #11131a}
.shelf.special{background:linear-gradient(180deg,#261f33,#1b1724)}
.pkbtn{all:unset;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:104px}
.pkbtn:focus-visible .pk{outline:3px solid var(--accent);outline-offset:3px}
.pkbtn:disabled{cursor:default}
.pkbtn:disabled .pk{filter:grayscale(.85) brightness(.55)}
.pkbtn:disabled .pk-price{opacity:.5}
.pk{position:relative;width:96px;height:136px;border-radius:6px;transition:transform .18s,box-shadow .18s;
  background:var(--pkbg,linear-gradient(160deg,#3a4cff,#9b3dff 55%,#ff4fa3));box-shadow:0 8px 18px rgba(0,0,0,.45);color:#fff;overflow:visible}
.pkbtn:not(:disabled):hover .pk{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 14px 26px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.18)}
.pk::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.28) 45%,rgba(255,255,255,0) 60%)}
.pk-top{position:absolute;left:0;right:0;top:0;height:18px;border-radius:6px 6px 0 0;background:inherit;filter:brightness(1.15);
  clip-path:polygon(0 0,100% 0,100% 70%,95% 100%,90% 70%,85% 100%,80% 70%,75% 100%,70% 70%,65% 100%,60% 70%,55% 100%,50% 70%,45% 100%,40% 70%,35% 100%,30% 70%,25% 100%,20% 70%,15% 100%,10% 70%,5% 100%,0 70%)}
.pk-body{position:absolute;inset:22px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.pk-logo{font-size:9px;font-weight:800;letter-spacing:.14em;opacity:.85}
.pk-body b{font-size:12.5px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pk-body small{font-size:9.5px;line-height:1.25;opacity:.85}
.pk-x{position:absolute;right:-6px;top:-8px;padding:1px 6px;border-radius:9px;background:#ff4fa3;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pk-badge{position:absolute;left:50%;bottom:-8px;translate:-50% 0;white-space:nowrap;padding:0 6px;border-radius:8px;background:#14161c;border:1px solid #3a3f50;font-size:10px;color:#cfd3df}
.pk.bundle{box-shadow:6px -6px 0 -1px rgba(255,255,255,.08),6px -6px 0 0 #2a2f3d,12px -12px 0 -1px rgba(255,255,255,.06),12px -12px 0 0 #232836,0 8px 18px rgba(0,0,0,.45)}
.pk-price{font-weight:800;font-size:13px;color:#ffe9a8;font-variant-numeric:tabular-nums}
.pk-basic{--pkbg:linear-gradient(160deg,#3a4cff,#9b3dff 55%,#ff4fa3)}
.pk-advanced{--pkbg:linear-gradient(160deg,#0f9b8e,#2c7be5 60%,#6f42c1)}
.pk-premium{--pkbg:linear-gradient(160deg,#b8860b,#ff9f1c 50%,#d7263d)}
.pk-series1{--pkbg:linear-gradient(160deg,#e85d75,#f9a03f 50%,#3fa34d)}
.pk-series2{--pkbg:linear-gradient(160deg,#00a6a6,#5e60ce 55%,#c77dff)}
.pk-gradeC{--pkbg:linear-gradient(135deg,#6e421c,#d39558 50%,#7a4a20)}
.pk-gradeB{--pkbg:linear-gradient(135deg,#6b7280,#e5e7eb 50%,#7d838c);color:#1f2329}
.pk-gradeA{--pkbg:linear-gradient(135deg,#9c6d08,#fff0a8 50%,#b8860b);color:#3a2a00}
.pk-tag{--pkbg:linear-gradient(160deg,hsl(var(--hue),70%,45%),hsl(calc(var(--hue) + 40),75%,35%))}
.pk-contest{--pkbg:linear-gradient(160deg,#4a3500,#d4a72c 45%,#fff0a8 55%,#8a6a10)}
.pk-special,.pk-special2{--pkbg:linear-gradient(160deg,#5b1a5e,#c2185b 55%,#ff8a00)}
.pk-gradeB .pk-body b,.pk-gradeA .pk-body b{text-shadow:none}

/* 개봉 화면의 팩도 산 팩 종류의 색으로 */
#pack[class*="pk-"] .body,#pack[class*="pk-"] .top{background:var(--pkbg)}
#pack.pk-gradeB .body,#pack.pk-gradeA .body{color:#2a2410}


/* 개봉 화면 왼쪽 아래: 남은 팩 */
#remainPacks{position:absolute;left:12px;bottom:10px;z-index:6;pointer-events:none}
#remainPacks .rp-label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:700}
#remainPacks .rp-row{display:flex;gap:4px;align-items:flex-end}
.pk.mini{width:30px;height:42px;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.pk.mini .pk-top{height:7px;border-radius:3px 3px 0 0}
.pk.mini.ghost{width:56px;height:78px;background:none;border:2px dashed #565d73;box-shadow:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:#7b8297;line-height:1.3}
.pk.mini.ghost::after{display:none}
.rp-more{font-size:11px;color:var(--muted);margin-left:2px}
/* 도감 팩보관함 */
.page.vaultp{background:radial-gradient(120% 90% at 30% 0%,#3a3046,#2a2335 60%,#211b2b)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px;justify-items:center}
.vslot{width:96px;height:136px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b6380;
  background:linear-gradient(180deg,#1d1826,#231d2e);box-shadow:inset 0 4px 10px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.06)}

/* ---------- 도감 버튼(왼쪽 아래) + 떠서 열리는 도감 ---------- */
.binder-fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(160deg,#2a3150,#1d2235);border:1px solid #4a5478;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.binder-fab small{font-weight:500;font-size:11px;color:var(--muted)}
.binder-fab:hover{border-color:var(--accent)}
.bmodal{position:fixed;inset:0;z-index:25;background:rgba(8,10,16,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 24px;animation:bmIn .22s ease-out}
@keyframes bmIn{from{opacity:0}to{opacity:1}}
.bpanel{width:min(900px,100%);background:var(--panel);border:1px solid #3a4058;border-radius:16px;padding:12px 14px 14px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:bpUp .25s cubic-bezier(.2,.8,.2,1)}
@keyframes bpUp{from{transform:translateY(30px) scale(.98)}to{transform:none}}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bhead b{font-size:16px}
.bjump{display:flex;gap:4px;align-items:center;margin-left:auto}
.bjump .tab{padding:5px 10px;font-size:13px}
.bjump .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bclose{margin-left:6px;width:34px;height:34px;padding:0;font-size:16px}

/* ---------- 도감: 스위치 칩 케이스처럼 오목한 칸에 카드가 끼워진 책 ---------- */
.book{display:flex;align-items:center;gap:10px;perspective:1800px}
.turn{flex:none;width:42px;height:120px;font-size:20px;border-radius:10px}
.pagewrap{flex:1;min-width:0;padding:6px;border-radius:16px;background:linear-gradient(90deg,#11131a,#1a1d27 6%,#1a1d27 94%,#11131a);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px #2c3040}
.page{border-radius:12px;padding:12px 14px 16px;transform-origin:left center;
  background:radial-gradient(120% 90% at 30% 0%,#2e3446,#232838 60%,#1d2130);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 6px rgba(0,0,0,.4)}
.page.freep{background:radial-gradient(120% 90% at 30% 0%,#2f3a36,#232c2a 60%,#1c2422)}
.page.in-next{animation:pageNext .5s cubic-bezier(.2,.7,.2,1)}
.page.in-prev{animation:pagePrev .5s cubic-bezier(.2,.7,.2,1);transform-origin:right center}
@keyframes pageNext{from{transform:rotateY(-80deg);opacity:.2;filter:brightness(.6)}to{transform:none;opacity:1;filter:none}}
@keyframes pagePrev{from{transform:rotateY(80deg);opacity:.2;filter:brightness(.6)}to{transform:none;opacity:1;filter:none}}
.ptitle{font-weight:800;font-size:13px;color:#c9cfdf;margin-bottom:8px;letter-spacing:.04em}
.brow{display:flex;gap:10px;align-items:center;margin-bottom:10px;padding:6px 8px;border-radius:10px;border:1px solid transparent}
.brow.done{border-color:#d4a72c;background:rgba(212,167,44,.08);box-shadow:0 0 18px rgba(255,215,106,.15)}
.rlabel{flex:none;width:86px;font-size:12px;color:#b8bfd3;line-height:1.4}
.rlabel b{color:#ffd76a}
.bcells{display:grid;grid-template-columns:repeat(4,minmax(0,104px));gap:12px}
.bcells.free{grid-template-columns:repeat(4,minmax(0,104px))}
.bslot{--cw:94px;--ch:132px;position:relative;aspect-ratio:104/142;border-radius:12px;cursor:default;
  background:linear-gradient(180deg,#151821,#1b1f2b);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05)}
.bslot .no{position:absolute;left:8px;top:6px;font-size:10px;color:#5d6478;font-weight:700}
.bslot .ghost{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#4d5468;line-height:1.5;filter:grayscale(1);opacity:.6}
.bslot.has{cursor:pointer}
.bslot.has .ghost,.bslot.has .no{display:none}
.bslot.sel{outline:3px solid var(--accent);outline-offset:2px}
.bcard{position:absolute;inset:5px;transform-style:preserve-3d;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.bcard .card{cursor:pointer}
.bcard .card:hover{transform:translateY(-3px)}
.bcard .zoom{font-size:.8em}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0 52px;align-items:center;justify-content:space-between;margin-right:52px}
.tabs .tab{padding:3px 8px;font-size:12px}
.tabs .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.selbar{border-color:var(--accent)}
@media (max-width:640px){
  .turn{width:30px;height:80px}
  .brow{flex-direction:column;align-items:stretch;gap:4px}
  .rlabel{width:auto}
  .bcells,.bcells.free{gap:6px}
  .bslot{--cw:64px;--ch:90px}
  .tabs{margin:8px 0 0}
}

/* 카드 앨범 (메타) */
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.alb div{border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;background:var(--panel)}
.alb .s0{color:#555}.alb .s1{color:var(--muted)}.alb .s2{border-color:var(--good)}

.log{font-size:12px;color:var(--muted);max-height:200px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.over{border:2px solid var(--bad);background:#2a1618;border-radius:8px;padding:14px;margin:12px 0}

/* ---------- 개봉 화면 (demo/unpack.html과 같은 엔진·스타일) ---------- */
/* 상점 화면을 배경에 흐리게 남긴 채 그 위에서 개봉 */
#opening{position:fixed;inset:0;z-index:30;background:rgba(12,14,20,.62);-webkit-backdrop-filter:blur(6px) saturate(.8);backdrop-filter:blur(6px) saturate(.8);display:flex;flex-direction:column}
#opening[hidden]{display:none!important}
#opening header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--panel);font-size:13px}
#opening header h1{font-size:15px;margin:0}
#opening header .sp{margin-left:auto;display:flex;gap:14px}
#opening footer{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);min-height:58px;font-size:13px}
#opening footer .hint{color:var(--muted)}
#settleList{position:absolute;left:12px;top:10px;font-size:12px;color:var(--muted);max-width:320px;max-height:calc(100% - 20px);overflow-y:auto;z-index:20;line-height:1.5;background:rgba(20,22,28,.96);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#settleList:empty{display:none}
#settleList b{color:var(--text)}
</style>
</head>
<body>
<div id="app">불러오는 중…</div>

<div id="opening" hidden>
  <header><h1 id="oTitle">개봉</h1><div class="sp" id="oStat"></div></header>
  <div id="stage">
    <div id="settleList"></div>
    <div id="remainPacks"></div>
    <div id="table"></div>
  </div>
  <footer id="bar"></footer>
</div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="modal">
  <div class="holder" id="holder"></div>
  <div class="info" id="info"></div>
  <div class="btns"><button id="mFlip">뒤집기</button><button id="mReset">정면</button><button class="primary" id="mClose">닫기</button></div>
</div>

<script src="js/cards.js"></script>
<script src="js/unpack.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
